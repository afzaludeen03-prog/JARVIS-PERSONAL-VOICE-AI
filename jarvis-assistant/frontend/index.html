<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. // Personal AI</title>

    <!-- Custom Glowing AI Core Browser Tab Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='50%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305070d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='url(%23g)' stroke-width='3' opacity='0.5'/%3E%3Cpath d='M32 14 L36.5 27.5 L50 32 L36.5 36.5 L32 50 L27.5 36.5 L14 32 L27.5 27.5 Z' fill='url(%23g)'/%3E%3C/svg%3E">

    <!-- Broad, Flagship AI Fonts (Sora + DM Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #03050a;
            --surface: rgba(13, 19, 34, 0.56);
            --surface-elevated: rgba(20, 29, 50, 0.78);
            --surface-card: rgba(255, 255, 255, 0.032);
            --border: rgba(255, 255, 255, 0.08);
            --border-bright: rgba(255, 255, 255, 0.16);
            --accent: #38bdf8;
            --accent-rgb: 56, 189, 248;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --emerald: #10b981;
            --violet: #a855f7;
            --rose: #f43f5e;
            --amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 22px 18px;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        /* Gemini Live–Style Dynamic Aurora Backdrop */
        .aurora-backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 65% 45% at 50% 105%, rgba(var(--accent-rgb), 0.22) 0%, transparent 70%),
                radial-gradient(circle at 50% 42%, rgba(var(--accent-rgb), 0.11) 0%, transparent 55%),
                radial-gradient(circle at 12% 18%, rgba(99, 102, 241, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 88% 82%, rgba(16, 185, 129, 0.05) 0%, transparent 45%);
            transition: background 0.8s ease;
        }

        header, .workspace, .dock-wrapper {
            position: relative;
            z-index: 2;
        }

        /* === HEADER === */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: var(--surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(168, 85, 247, 0.22));
            border: 1px solid rgba(56, 189, 248, 0.38);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.18);
        }

        .brand-logo svg { width: 17px; height: 17px; color: #7dd3fc; }

        .brand-text {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 2.8px;
            background: linear-gradient(120deg, #ffffff 10%, #bae6fd 58%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-indicator {
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 999px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 8px var(--emerald);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            border-color: var(--border-bright);
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.07);
        }

        .nav-btn.live-active {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(56, 189, 248, 0.18));
            border-color: rgba(16, 185, 129, 0.55);
            color: #6ee7b7;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.2);
        }

        .nav-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #bae6fd;
        }

        .nav-btn.muted {
            background: rgba(244, 63, 94, 0.12);
            border-color: rgba(244, 63, 94, 0.38);
            color: #fda4af;
        }

        #clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 10px;
        }

        /* === SETTINGS POPOVER === */
        .settings-popover {
            position: fixed;
            top: 74px;
            right: 22px;
            width: 300px;
            background: var(--surface-elevated);
            backdrop-filter: blur(32px);
            border: 1px solid var(--border-bright);
            border-radius: 16px;
            padding: 18px;
            z-index: 50;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: popIn 0.2s ease;
        }

        .settings-popover.open { display: flex; }

        @keyframes popIn {
            from { opacity: 0; transform: translateY(-6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            display: flex;
            justify-content: space-between;
            font-family: 'Sora', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        select {
            background: rgba(3, 5, 10, 0.75);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 12.5px;
            padding: 8px 10px;
            border-radius: 10px;
            outline: none;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        /* === MAIN WORKSPACE === */
        .workspace {
            display: grid;
            grid-template-columns: 270px 1fr 370px;
            gap: 18px;
            flex: 1;
            margin: 16px 0;
            overflow: hidden;
            transition: grid-template-columns 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.zen-mode .workspace {
            grid-template-columns: 0px 1fr 0px;
            gap: 0px;
        }

        body.zen-mode .side-panel {
            opacity: 0;
            pointer-events: none;
            padding: 0;
            border-width: 0;
        }

        .side-panel {
            background: var(--surface);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            overflow: hidden;
            transition: opacity 0.25s ease, padding 0.3s ease;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .panel-title {
            font-family: 'Sora', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.4px;
            color: var(--text-primary);
        }

        .chip-live {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--emerald);
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 3px 8px;
            border-radius: 999px;
        }

        .panel-actions {
            display: flex;
            gap: 6px;
        }

        .btn-mini {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            padding: 4px 9px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-mini:hover {
            color: var(--text-primary);
            border-color: var(--border-bright);
            background: rgba(255, 255, 255, 0.08);
        }

        /* === LEFT PANEL: TELEMETRY SPARKLINES === */
        .metrics-stack {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .metric-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 14px;
            transition: border-color 0.2s ease;
        }

        .metric-card:hover { border-color: var(--border-bright); }

        .metric-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .metric-name { font-size: 12px; font-weight: 500; color: var(--text-secondary); }

        .metric-value {
            font-family: 'Sora', sans-serif;
            font-size: 19px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .sparkline-svg {
            width: 100%;
            height: 22px;
            margin-bottom: 6px;
            overflow: visible;
        }

        .gauge-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 999px;
            overflow: hidden;
        }

        .gauge-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .fill-cpu { background: linear-gradient(90deg, #3b82f6, #38bdf8); box-shadow: 0 0 10px rgba(56, 189, 248, 0.45); }
        .fill-gpu { background: linear-gradient(90deg, #059669, #34d399); box-shadow: 0 0 10px rgba(52, 211, 153, 0.4); }
        .fill-ram { background: linear-gradient(90deg, #d97706, #fbbf24); box-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }

        .sidebar-footer {
            margin-top: auto;
            padding-top: 14px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .shortcuts-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
        }

        kbd {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 5px;
        }

        .btn-end {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(244, 63, 94, 0.09);
            border: 1px solid rgba(244, 63, 94, 0.26);
            color: #fda4af;
            padding: 10px 14px;
            font-family: 'Sora', sans-serif;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .btn-end:hover {
            background: rgba(244, 63, 94, 0.2);
            border-color: rgba(244, 63, 94, 0.55);
            color: #ffffff;
        }

        /* === CENTER STAGE: GEMINI LIVE VOICE ORB === */
        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 10px 24px;
        }

        .orb-stage {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .orb-stage:hover { transform: scale(1.03); }
        .orb-stage:active { transform: scale(0.97); }

        #liveCanvas {
            position: absolute;
            inset: 0;
            width: 320px;
            height: 320px;
            pointer-events: none;
        }

        .orb-hud-center {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .orb-icon {
            color: rgba(255, 255, 255, 0.94);
            filter: drop-shadow(0 0 12px rgba(var(--accent-rgb), 0.75));
        }

        .orb-label {
            font-family: 'Sora', sans-serif;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 2.8px;
            color: rgba(255, 255, 255, 0.92);
        }

        .status-badge {
            margin-top: 6px;
            font-family: 'Sora', sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 1.8px;
            color: var(--accent);
            background: rgba(var(--accent-rgb), 0.1);
            border: 1px solid rgba(var(--accent-rgb), 0.28);
            padding: 6px 18px;
            border-radius: 999px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .live-caption {
            margin-top: 16px;
            font-family: 'Sora', sans-serif;
            font-size: 17px;
            font-weight: 400;
            color: var(--text-primary);
            text-align: center;
            max-width: 520px;
            min-height: 52px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.3s ease;
        }

        .live-caption.muted-caption { color: var(--text-muted); font-size: 14px; }

        .quick-actions {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 520px;
        }

        .quick-pill {
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .quick-pill:hover {
            background: rgba(var(--accent-rgb), 0.12);
            border-color: rgba(var(--accent-rgb), 0.38);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        /* === RIGHT PANEL: CONVERSATION STREAM === */
        .chat-stream {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 4px;
        }

        .chat-stream::-webkit-scrollbar { width: 4px; }
        .chat-stream::-webkit-scrollbar-track { background: transparent; }
        .chat-stream::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 999px; }

        .msg-row {
            display: flex;
            flex-direction: column;
            animation: slideUp 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-sys {
            align-self: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .msg-you {
            align-self: flex-end;
            max-width: 88%;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.24), rgba(56, 189, 248, 0.14));
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 16px 16px 4px 16px;
            font-size: 13px;
            line-height: 1.5;
        }

        .msg-jarvis {
            align-self: flex-start;
            max-width: 95%;
            background: var(--surface-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 11px 14px;
            border-radius: 16px 16px 16px 4px;
            font-size: 13px;
            line-height: 1.55;
        }

        .msg-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .msg-author {
            font-family: 'Sora', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.6px;
            color: #38bdf8;
        }

        .copy-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
        }

        .msg-jarvis:hover .copy-btn { opacity: 1; }
        .copy-btn:hover { color: var(--text-primary); }

        /* === FLOATING COMMAND DOCK === */
        .dock-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .command-bar {
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(13, 19, 34, 0.84);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border);
            padding: 7px 8px 7px 20px;
            border-radius: 999px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .command-bar:focus-within {
            border-color: rgba(56, 189, 248, 0.48);
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), 0 0 26px rgba(56, 189, 248, 0.14);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]::placeholder { color: var(--text-muted); }

        .btn-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-circle:hover {
            background: rgba(56, 189, 248, 0.14);
            border-color: rgba(56, 189, 248, 0.42);
            color: #38bdf8;
        }

        .btn-send {
            display: flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            border: none;
            color: #03050a;
            padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 999px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.28);
        }

        .btn-send:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(56, 189, 248, 0.45);
            filter: brightness(1.06);
        }
    </style>
</head>
<body onload="initJarvisSession()">

    <div class="aurora-backdrop"></div>

    <!-- Top Navigation Bar -->
    <header>
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3l1.9 5.8L20 10.7l-6.1 1.9L12 18.5l-1.9-5.9L4 10.7l6.1-1.9L12 3z"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>J.A.R.V.I.S.</h1>
                <span class="live-indicator"><span class="dot"></span>English Live</span>
            </div>
        </div>

        <div class="header-actions">
            <button id="liveModeBtn" class="nav-btn" onclick="toggleLiveMode()" title="Continuous hands-free conversation (L)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/>
                </svg>

    <div class="workspace">

    <!-- Floating Command Dock -->
    <div class="dock-wrapper">
        <div class="command-bar">
            <input type="text" id="userInput" placeholder="Ask JARVIS anything in English..." autofocus>
            <button class="btn-circle" onclick="handleOrbClick()" title="Voice Input (Space)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8" y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <button class="btn-send" onclick="sendQuery()">
                <span>Send</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin.startsWith('http') ? '' : 'http://127.0.0.1:8000';

        // Core State
        let currentState = 'ready'; // ready | listening | thinking | speaking | error
        let liveMode = false;
        let isMuted = false;
        let speechRate = 1.05;
        let activeRecognition = null;
        let englishVoices = [];
        let transcriptLog = [];

        // Real-Time Microphone Audio Analyser (Web Audio API)
        let audioCtx = null;
        let analyser = null;
        let micStream = null;
        let micDataArray = null;
        let liveMicEnergy = 0;

        async function startMicVisualizer() {
            try {
                if (!micStream) {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioCtx.createMediaStreamSource(micStream);
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 64;
                    source.connect(analyser);
                    micDataArray = new Uint8Array(analyser.frequencyBinCount);
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();
            } catch (e) {
                // Gracefully fallback to smooth simulated wave if analyser is blocked
            }
        }

        function sampleMicEnergy() {
            if (currentState === 'listening' && analyser && micDataArray) {
                analyser.getByteFrequencyData(micDataArray);
                let sum = 0;
                for (let i = 0; i < micDataArray.length; i++) sum += micDataArray[i];
                const avg = sum / micDataArray.length;
                liveMicEnergy += ((avg / 255) * 42 - liveMicEnergy) * 0.25;
            } else {
                liveMicEnergy *= 0.85;
            }
        }

        // === 60FPS GEMINI LIVE FLUID ORB ENGINE ===
        const canvas = document.getElementById('liveCanvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width, H = canvas.height, CX = W / 2, CY = H / 2;

        const themes = {
            ready:     { r: 56,  g: 189, b: 248, speed: 0.018, amp: 5  },
            listening: { r: 16,  g: 185, b: 129, speed: 0.052, amp: 14 },
            thinking:  { r: 168, g: 85,  b: 247, speed: 0.088, amp: 11 },
            speaking:  { r: 244, g: 63,  b: 94,  speed: 0.072, amp: 20 },
            error:     { r: 244, g: 63,  b: 94,  speed: 0.015, amp: 3  }
        };

        let curC = { r: 56, g: 189, b: 248 };
        let curAmp = 5;
        let phase = 0;

        const particles = Array.from({ length: 32 }, (_, i) => ({
            angle: (Math.PI * 2 * i) / 32,
            radius: 185 + Math.random() * 68,
            size: 1.5 + Math.random() * 2.2,
            speed: (Math.random() * 0.007 + 0.003) * (i % 2 === 0 ? 1 : -1),
            alpha: 0.2 + Math.random() * 0.55
        }));

        function drawOrb() {
            sampleMicEnergy();
            const t = themes[currentState] || themes.ready;

            curC.r += (t.r - curC.r) * 0.08;
            curC.g += (t.g - curC.g) * 0.08;
            curC.b += (t.b - curC.b) * 0.08;

            const targetAmp = t.amp + (currentState === 'listening' ? liveMicEnergy : 0);
            curAmp += (targetAmp - curAmp) * 0.14;
            phase += t.speed;

            const rgb = `${Math.round(curC.r)}, ${Math.round(curC.g)}, ${Math.round(curC.b)}`;
            ctx.clearRect(0, 0, W, H);

            // Outer Aurora Halo
            const haloR = 260 + curAmp * 1.4;
            const halo = ctx.createRadialGradient(CX, CY, 65, CX, CY, haloR);
            halo.addColorStop(0, `rgba(${rgb}, 0.36)`);
            halo.addColorStop(0.55, `rgba(${rgb}, 0.09)`);
            halo.addColorStop(1, `rgba(${rgb}, 0)`);
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(CX, CY, haloR, 0, Math.PI * 2);
            ctx.fill();

            // Orbiting Neural Dust
            particles.forEach(p => {
                p.angle += p.speed * (currentState === 'thinking' ? 3.4 : currentState === 'speaking' ? 2.2 : 1);
                const wobble = Math.sin(phase * 1.4 + p.angle * 3) * (curAmp * 0.55);
                const x = CX + Math.cos(p.angle) * (p.radius + wobble);
                const y = CY + Math.sin(p.angle) * (p.radius + wobble);
                ctx.fillStyle = `rgba(${rgb}, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(x, y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Precision Orbital Arcs
            ctx.save();
            ctx.translate(CX, CY);
            ctx.rotate(phase * 0.42);
            ctx.strokeStyle = `rgba(${rgb}, 0.45)`;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(0, 0, 224, 0, Math.PI * 0.72);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, 224, Math.PI, Math.PI * 1.68);
            ctx.stroke();
            ctx.restore();

            // Multi-Layer Fluid Waveforms
            for (let layer = 0; layer < 3; layer++) {
                ctx.beginPath();
                const baseR = 142 + layer * 11;
                const steps = 100;
                for (let i = 0; i <= steps; i++) {
                    const theta = (i / steps) * Math.PI * 2;
                    const w1 = Math.sin(theta * (3 + layer) + phase * (1.8 + layer * 0.4)) * curAmp;
                    const w2 = Math.cos(theta * (5 - layer) - phase * 1.3) * (curAmp * 0.45);
                    const r = baseR + w1 + w2;
                    const x = CX + Math.cos(theta) * r;
                    const y = CY + Math.sin(theta) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = `rgba(${rgb}, ${0.8 - layer * 0.22})`;
                ctx.lineWidth = 2.6 - layer * 0.5;
                ctx.stroke();
            }

            // Glassmorphic Core Sphere
            const coreR = 134 + (currentState === 'listening' ? liveMicEnergy * 0.25 : 0);
            const coreGrad = ctx.createRadialGradient(CX - 36, CY - 42, 12, CX, CY, coreR);
            coreGrad.addColorStop(0, `rgba(${rgb}, 0.36)`);
            coreGrad.addColorStop(0.55, `rgba(9, 15, 30, 0.92)`);
            coreGrad.addColorStop(1, `rgba(4, 7, 16, 0.98)`);
            ctx.fillStyle = coreGrad;
            ctx.beginPath();
            ctx.arc(CX, CY, coreR, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(${rgb}, 0.65)`;
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(drawOrb);
        }
        drawOrb();

        // === STRICTLY ENGLISH VOICES LOADER ===
        function populateVoices() {
            const all = window.speechSynthesis.getVoices();
            englishVoices = all.filter(v => v.lang.toLowerCase().startsWith('en'));
            const select = document.getElementById('voiceSelect');
            const prev = select.value;
            select.innerHTML = '';

            englishVoices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name.replace('Microsoft ', '').replace('Google ', '')} (${v.lang})`;
                if (!prev && (v.lang === 'en-US' || v.name.includes('Aria') || v.name.includes('Guy'))) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
            if (prev) select.value = prev;
        }
        populateVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = populateVoices;
        }

        // === CLOCK & TELEMETRY SPARKLINES ===
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        const MAX_PTS = 18;
        const cpuHist = Array(MAX_PTS).fill(0);
        const gpuHist = Array(MAX_PTS).fill(0);
        const ramHist = Array(MAX_PTS).fill(0);

        function drawSpark(id, arr) {
            const pts = arr.map((v, i) => {
                const x = (i / (MAX_PTS - 1)) * 100;
                const y = 20 - (Math.min(100, Math.max(0, v)) / 100) * 18;
                return `${x.toFixed(1)},${y.toFixed(1)}`;
            }).join(' ');
            document.getElementById(id).setAttribute('points', pts);
        }

        async function fetchTelemetry() {
            try {
                const res = await fetch(`${API_BASE}/api/telemetry`);
                const d = await res.json();
                document.getElementById('cpuVal').innerText = d.cpu + '%';
                document.getElementById('cpuBar').style.width = d.cpu + '%';
                cpuHist.push(d.cpu); cpuHist.shift(); drawSpark('cpuSpark', cpuHist);

                document.getElementById('gpuVal').innerText = d.gpu + '%';
                document.getElementById('gpuBar').style.width = d.gpu + '%';
                gpuHist.push(d.gpu); gpuHist.shift(); drawSpark('gpuSpark', gpuHist);

                document.getElementById('ramVal').innerText = d.ram + '%';
                document.getElementById('ramBar').style.width = d.ram + '%';
                ramHist.push(d.ram); ramHist.shift(); drawSpark('ramSpark', ramHist);
            } catch (e) {}
        }
        fetchTelemetry();
        setInterval(fetchTelemetry, 2500);

        // === UI & SETTINGS CONTROLS ===
        function toggleLiveMode() {
            liveMode = !liveMode;
            const btn = document.getElementById('liveModeBtn');
            const lbl = document.getElementById('liveModeLabel');
            btn.classList.toggle('live-active', liveMode);
            lbl.innerText = liveMode ? 'Live On' : 'Go Live';
            logActivity('SYS', liveMode ? 'Gemini Live continuous mode active' : 'Live mode paused');
            if (liveMode && currentState === 'ready') startVoiceRecognition();
        }

        function toggleZenMode() {
            document.body.classList.toggle('zen-mode');
            document.getElementById('zenBtn').classList.toggle('active');
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').classList.toggle('muted', isMuted);
            document.getElementById('muteLabel').innerText = isMuted ? 'Muted' : 'Voice On';
            if (isMuted) {
                window.speechSynthesis.cancel();
                if (currentState === 'speaking') setState('ready');
            }
        }

        function toggleSettings() {
            document.getElementById('settingsPopover').classList.toggle('open');
        }

        function updateRate(val) {
            speechRate = parseFloat(val);
            document.getElementById('rateVal').innerText = speechRate.toFixed(2) + 'x';
        }

        function clearChat() {
            transcriptLog = [];
            document.getElementById('chatStream').innerHTML =
                '<div class="msg-row"><span class="msg-sys">Transcript cleared</span></div>';
        }

        function exportTranscript() {
            if (!transcriptLog.length) return;
            const blob = new Blob([transcriptLog.join('\n\n')], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `JARVIS_Session_${new Date().toISOString().slice(0,10)}.txt`;
            a.click();
        }

        // === STATE & TRANSCRIPT ===
        function setState(state, caption = null) {
            currentState = state;
            const t = themes[state] || themes.ready;
            document.documentElement.style.setProperty('--accent', `rgb(${t.r}, ${t.g}, ${t.b})`);
            document.documentElement.style.setProperty('--accent-rgb', `${t.r}, ${t.g}, ${t.b}`);

            const badge = document.getElementById('statusBadge');
            const label = document.getElementById('coreLabel');
            const cap = document.getElementById('liveCaption');

            if (state === 'listening') {
                badge.innerText = liveMode ? 'Live • Listening' : 'Listening...';
                label.innerText = 'LISTENING';
                cap.innerText = caption || 'Listening... speak now';
                cap.classList.remove('muted-caption');
            } else if (state === 'thinking') {
                badge.innerText = 'Thinking...';
                label.innerText = 'THINKING';
                cap.innerText = caption || 'Processing your request...';
                cap.classList.add('muted-caption');
            } else if (state === 'speaking') {
                badge.innerText = 'Speaking';
                label.innerText = 'SPEAKING';
                if (caption) cap.innerText = caption;
                cap.classList.remove('muted-caption');
            } else if (state === 'error') {
                badge.innerText = 'Connection Error';
                label.innerText = 'RETRY';
                cap.innerText = 'Unable to reach local server.py';
                cap.classList.add('muted-caption');
            } else {
                badge.innerText = 'Standby • Ready';
                label.innerText = 'TAP TO TALK';
                if (!caption) {
                    cap.innerText = 'Tap the orb or click Go Live for hands-free voice chat.';
                    cap.classList.add('muted-caption');
                }
            }
        }

        function logActivity(sender, text) {
            const stream = document.getElementById('chatStream');
            const row = document.createElement('div');
            row.className = 'msg-row';

            if (sender === 'SYS') {
                const span = document.createElement('span');
                span.className = 'msg-sys';
                span.innerText = text;
                row.appendChild(span);
            } else if (sender === 'YOU') {
                transcriptLog.push(`YOU: ${text}`);
                const div = document.createElement('div');
                div.className = 'msg-you';
                div.innerText = text;
                row.appendChild(div);
            } else {
                transcriptLog.push(`J.A.R.V.I.S.: ${text}`);
                const box = document.createElement('div');
                box.className = 'msg-jarvis';

                const meta = document.createElement('div');
                meta.className = 'msg-meta';
                meta.innerHTML = '<span class="msg-author">J.A.R.V.I.S.</span>';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerText = 'Copy';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(text);
                    copyBtn.innerText = 'Copied';
                    setTimeout(() => copyBtn.innerText = 'Copy', 1400);
                };
                meta.appendChild(copyBtn);

                const body = document.createElement('div');
                body.innerText = text;

                box.appendChild(meta);
                box.appendChild(body);
                row.appendChild(box);
            }

            stream.appendChild(row);
            stream.scrollTop = stream.scrollHeight;
        }

        // === VOICE ENGINE (STRICTLY ENGLISH) ===
        function initJarvisSession() {
            logActivity('SYS', 'Personal AI online • English Core');
            const greeting = "J.A.R.V.I.S. online, Sir. How may I assist you today?";
            logActivity('JARVIS', greeting);
            speakText(greeting, false);
        }

        function endSession() {
            liveMode = false;
            document.getElementById('liveModeBtn').classList.remove('live-active');
            document.getElementById('liveModeLabel').innerText = 'Go Live';
            if (activeRecognition) { try { activeRecognition.stop(); } catch (e) {} }
            window.speechSynthesis.cancel();
            const closing = "Wrapping up our session, Sir.";
            logActivity('JARVIS', closing);
            speakText(closing, false);
        }

        function speakText(text, allowAutoListen = true) {
            window.speechSynthesis.cancel();

            if (isMuted) {
                setState('ready', text);
                if (liveMode && allowAutoListen) setTimeout(startVoiceRecognition, 500);
                return;
            }

            setState('speaking', text);

            const cleanText = text.replace(/[*#`]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);

            if (!englishVoices.length) populateVoices();
            const idx = document.getElementById('voiceSelect').value;
            const chosen = englishVoices[idx] ||
                           englishVoices.find(v => v.lang === 'en-US') ||
                           englishVoices.find(v => v.lang === 'en-GB') ||
                           englishVoices[0];

            if (chosen) utterance.voice = chosen;
            utterance.lang = 'en-US';
            utterance.pitch = 0.92;
            utterance.rate = speechRate;

            utterance.onend = utterance.onerror = function() {
                setState('ready');
                if (liveMode && allowAutoListen) {
                    setTimeout(() => {
                        if (currentState === 'ready' && liveMode) startVoiceRecognition();
                    }, 420);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function handleOrbClick() {
            if (currentState === 'listening' && activeRecognition) {
                activeRecognition.stop();
                setState('ready');
                return;
            }
            if (currentState === 'speaking') {
                window.speechSynthesis.cancel();
            }
            startVoiceRecognition();
        }

        function startVoiceRecognition() {
            window.speechSynthesis.cancel();
            startMicVisualizer();

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition requires Google Chrome or Microsoft Edge.");
                return;
            }

            const recognition = new SpeechRecognition();
            activeRecognition = recognition;
            recognition.lang = 'en-US';
            recognition.interimResults = true;

            const input = document.getElementById('userInput');

            recognition.onstart = () => setState('listening');

            recognition.onresult = (event) => {
                const res = event.results[0];
                const transcript = res[0].transcript;
                input.value = transcript;
                document.getElementById('liveCaption').innerText = `"${transcript}"`;

                if (res.isFinal) {
                    recognition.stop();
                    sendQuery(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.error("Voice error:", event.error);
                activeRecognition = null;
                setState('ready');
            };

            recognition.onend = () => {
                activeRecognition = null;
                if (currentState === 'listening') setState('ready');
            };

            recognition.start();
        }

        async function sendQuery(customQuery = null) {
            const input = document.getElementById('userInput');
            const query = customQuery || input.value.trim();
            if (!query) return;

            logActivity('YOU', query);
            input.value = '';
            setState('thinking', `"${query}"`);
            const t0 = performance.now();

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: query })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await res.json();
                const secs = ((performance.now() - t0) / 1000).toFixed(1);
                logActivity('SYS', `Answered in ${secs}s`);
                logActivity('JARVIS', data.reply);
                speakText(data.reply, true);

            } catch (err) {
                console.error(err);
                logActivity('SYS', 'Connection error to local server');
                setState('error');
            }
        }

        // Keyboard Shortcuts
        document.getElementById('userInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendQuery();
        });

        document.addEventListener('keydown', (e) => {
            const typing = document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'SELECT';
            if (e.code === 'Space' && !typing) {
                e.preventDefault();
                handleOrbClick();
            } else if (e.key.toLowerCase() === 'l' && !typing) {
                toggleLiveMode();
            } else if (e.code === 'Escape') {
                window.speechSynthesis.cancel();
                if (activeRecognition) { try { activeRecognition.stop(); } catch (err) {} }
                document.getElementById('settingsPopover').classList.remove('open');
                setState('ready');
            }
        });
    </script>
</body>
